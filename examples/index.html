<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>summernote-ext-tableprops demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.css"
        integrity="sha384-ujmZ40iFsxEHUq6QCcxwjfGi1W9lk9SkvB4Kz6ZCDGh5G1LF41x7qOfDJnBo82CS" crossorigin="anonymous">
  <link rel="stylesheet" href="../src/summernote-ext-tableprops.css">
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #1d2733; }
  </style>
</head>
<body>
  <h1>summernote-ext-tableprops</h1>
  <p>Click in a cell, then the table properties button in the table popover (or the toolbar).</p>

  <div id="editor">
    <table>
      <tbody>
        <tr><td>Station</td><td>Salinity</td><td>Temperature</td></tr>
        <tr><td>Choptank</td><td>9.8</td><td>21.4</td></tr>
        <tr><td>Patuxent</td><td>12.1</td><td>22.0</td></tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.1/dist/summernote-lite.min.js"
          integrity="sha384-PIcWJ29rkVSUGtsk8A9iQDkUN50LgPkoQkzKDBEgwZsyiCnqx/L7Y3JHT+aeKw86" crossorigin="anonymous"></script>
  <script src="../src/summernote-ext-tableprops.js"></script>
  <script>
    $('#editor').summernote({
      height: 240,
      toolbar: [['table', ['table', 'tableprops']], ['view', ['codeview']]],
      popover: {
        table: [
          ['add', ['addRowDown', 'addRowUp', 'addColLeft', 'addColRight']],
          ['delete', ['deleteRow', 'deleteCol', 'deleteTable']],
          ['props', ['tableprops']]
        ]
      }
    });
  </script>
</body>
</html>
